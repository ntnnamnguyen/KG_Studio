[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-studio"
version = "2.0.0"
description = "Knowledge Graph Studio — Commercial & ML Architecture with EDC+R, Target Alignment, and Active Learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0,<2.0.0",
    "openai>=1.50.0,<3.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "neo4j>=5.20.0,<6.0.0",
    "pypdf>=4.3.0,<6.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "graphviz>=0.20.3,<1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]
embed = [
    "sentence-transformers>=3.0.0",
]
ml = [
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "backend*", "frontend*", "ml_lab*"]

